<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="OptiView Player Tizen sample"/>
    <title>OptiView Player Tizen minimum example</title>
    <style>
    .theoplayer-tizen {
        padding-top: 56.25%;
    }

    video[src] {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
    }

    .theoplayer-ad-linear {
        position: absolute !important;
        top: 0;
        left: 0;
        right: 0;
        bottom:0;
    }

    </style>

</head>


<body>
<div class='theoplayer-tizen'></div>
<script src='libs/THEOplayer.chromeless.js'></script>

<script>
    const element = document.querySelector('.theoplayer-tizen');
    const player = new THEOplayer.Player(element, {
        fluid: true,
        libraryLocation: 'libs/'
    });

    const showCase = {
        hls: {
            sources: {
                src: 'https://cdn.theoplayer.com/video/elephants-dream/playlist.m3u8',
                type: 'application/x-mpegurl'
            }
        },
        dash: {
            sources: {
                src: 'https://demo.unified-streaming.com/video/tears-of-steel/tears-of-steel-multiple-subtitles.ism/.mpd',
                type: 'application/dash+xml'
            }
        },
        dashDrm: {
            sources: {
                src: 'https://d2jl6e4h8300i8.cloudfront.net/netflix_meridian/4k-18.5!9/keyos-logo/g180-avc_a2.0-vbr-aac-128k/r30/dash-wv-pr/stream.mpd',
                type: 'application/dash+xml',
                contentProtection: {
                    integration: 'keyos',
                    widevine: {},
                    playready: {},
                    preferredKeySystems: ['playready', 'widevine'],
                    customdata: 'PEtleU9TQXV0aGVudGljYXRpb25YTUw+PERhdGE+PEdlbmVyYXRpb25UaW1lPjIwMTYtMTEtMTkgMDk6MzQ6MDEuOTkyPC9HZW5lcmF0aW9uVGltZT48RXhwaXJhdGlvblRpbWU+MjAyNi0xMS0xOSAwOTozNDowMS45OTI8L0V4cGlyYXRpb25UaW1lPjxVbmlxdWVJZD4wZmZmMTk3YWQzMzQ0ZTMyOWU0MTA0OTIwMmQ5M2VlYzwvVW5pcXVlSWQ+PFJTQVB1YktleUlkPjdlMTE0MDBjN2RjY2QyOWQwMTc0YzY3NDM5N2Q5OWRkPC9SU0FQdWJLZXlJZD48V2lkZXZpbmVQb2xpY3kgZmxfQ2FuUGxheT0idHJ1ZSIgZmxfQ2FuUGVyc2lzdD0iZmFsc2UiIC8+PFdpZGV2aW5lQ29udGVudEtleVNwZWMgVHJhY2tUeXBlPSJIRCI+PFNlY3VyaXR5TGV2ZWw+MTwvU2VjdXJpdHlMZXZlbD48L1dpZGV2aW5lQ29udGVudEtleVNwZWM+PEZhaXJQbGF5UG9saWN5IC8+PExpY2Vuc2UgdHlwZT0ic2ltcGxlIiAvPjwvRGF0YT48U2lnbmF0dXJlPk1sNnhkcU5xc1VNalNuMDdicU8wME15bHhVZUZpeERXSHB5WjhLWElBYlAwOE9nN3dnRUFvMTlYK1c3MDJOdytRdmEzNFR0eDQydTlDUlJPU1NnREQzZTM4aXE1RHREcW9HelcwS2w2a0JLTWxHejhZZGRZOWhNWmpPTGJkNFVkRnJUbmxxU21raC9CWnNjSFljSmdaUm5DcUZIbGI1Y0p0cDU1QjN4QmtxMUREZUEydnJUNEVVcVJiM3YyV1NueUhGeVZqWDhCR3o0ZWFwZmVFeDlxSitKbWI3dUt3VjNqVXN2Y0Fab1ozSHh4QzU3WTlySzRqdk9Wc1I0QUd6UDlCc3pYSXhKd1ZSZEk3RXRoMjhZNXVEQUVZVi9hZXRxdWZiSXIrNVZOaE9yQ2JIVjhrR2praDhHRE43dC9nYWh6OWhVeUdOaXRqY2NCekJvZHRnaXdSUT09PC9TaWduYXR1cmU+PC9LZXlPU0F1dGhlbnRpY2F0aW9uWE1MPg==',
                },
            },
        }
    };

    player.source = showCase['hls']; // 'dash' | 'dashDrm'

    player.preload = 'auto';

    const keyCodes = {
        LEFT: 37,
        UP: 38,
        RIGHT: 39,
        DOWN: 40,
        CONFIRM: 13,
        // tizen
        RETURN: 10009,
        EXIT: 10182,
        MEDIAPLAYPAUSE: 10252
    };

    if (typeof window.tizen !== "undefined") {
        window.tizen.tvinputdevice.registerKey('MediaPlayPause'); // allow MediaPlayPause button
    }

    document.addEventListener('keydown', function (event) {
        switch (event.keyCode) {
            case keyCodes.CONFIRM:
            case keyCodes.MEDIAPLAYPAUSE:
                if (player.paused) {
                    player.play();
                } else {
                    player.pause();
                }
                break;
            case keyCodes.LEFT:
                player.currentTime -= 10;
                break;
            case keyCodes.RIGHT:
                player.currentTime += 10;
                break;
        }
    });

    // commonly used  events below for speeding up integration with implementation suggestions.
    // more can be found at https://docs.portal.theoplayer.com/api-reference/web/theoplayer.playereventmap.md
    player.addEventListener(['play', 'pause'], function () {
        if (player.paused) {
            console.log('player is paused');
        } else {
            console.log('player is unpaused');
        }
    });

    player.addEventListener('playing', function () {
        // (hide spinner if we were waiting)
        console.log('player starts playing after unpause');
    });

    player.addEventListener('seeking', 'seeked', function () {
        if (player.seeking) {
            // (show spinner)
            console.log('player is seeking to', player.currentTime);
        } else {
            // (hide spinner)
            console.log('playing is done seeking to', player.currentTime);
        }
    });

    player.addEventListener('waiting', function () {
        // (show spinner)
        console.log('player is waiting for data');
    });

    player.addEventListener('timeupdate', function () {
        // (update displayed currentTime)
        // console.log('currentTime is changed to', player.currentTime)
    });

    player.addEventListener('durationchange', function () {
        // duration is NaN: duration not yet known
        // duration is a finite number: video-on-demand
        // duration is Infinity: stream is live
        // Consider using seekable ranges to determine duration when live: https://docs.portal.theoplayer.com/api-reference/web/theoplayer.chromelessplayer.seekable.md#chromelessplayerseekable-property
        console.log('duration is changed to', player.duration);
    });

    // API is similar for audioTracks. Just change textTracks to audioTracks in that case.
    // API: https://docs.portal.theoplayer.com/api-reference/web/theoplayer.tracklisteventmap.md
    player.textTracks.addEventListener('addtrack', function (addTrackEvent) {
        // TextTrack API: https://docs.portal.theoplayer.com/api-reference/web/theoplayer.texttrack.md
        const track = addTrackEvent.track;
        console.log('track is added', track);

        // TextTrack events API: https://docs.portal.theoplayer.com/api-reference/web/theoplayer.trackeventmap.md
        track.addEventListener('addcue', function (addCueEvent) {

            // Cue API object: https://docs.portal.theoplayer.com/api-reference/web/theoplayer.texttrackcue.md
            // Cue events API: https://docs.portal.theoplayer.com/api-reference/web/theoplayer.texttrackcueeventmap.md
            // note: cue content can differ for metadata cues. Refer to details for specific type for more details.
            const cue = addCueEvent.cue;
            console.log('cue is added', cue);
        });
    });


</script>

</body>

</html>
