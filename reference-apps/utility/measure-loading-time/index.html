<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <link rel="icon" href="../../../assets/favicon.ico">
    <link rel="stylesheet" href="../../../assets/sample.css">
    <title>Measure Loading time - OptiView Player Web SDK samples</title>
    <link rel="stylesheet" type="text/css" href="../../../node_modules/theoplayer/ui.css" />
    <style>
        .theoplayer-container {aspect-ratio: 16 / 9;}
    </style>
</head>
<body>
<nav class="navbar">
  <a href="../../../index.html"><img src="../../../assets/dolby-optiview-white.svg" alt="Dolby OptiView"></a>
  <div class="navbar__links">
    <a href="../../../index.html">All samples</a>
    <a href="README.md">README</a>
    <a href="https://optiview.dolby.com/docs/theoplayer/">Docs</a>
  </div>
</nav>
<main class="sample">
<div class="theoplayer-container video-js theoplayer-skin"></div>
<script>
    const LIBRARY_LOCATION = "../../../node_modules/theoplayer/";

    function loadJsFile(url, callback) {
        let startLoadTime;
        const script = document.createElement("script");

        window.addEventListener("theoplayerready", function () {
            console.log(
                "It took",
                Date.now() - startLoadTime,
                "milliseconds from loading the OptiView Player library to dispatching the theoplayerready event."
            );
        });

        script.onload = function () {
            console.log(url, "has been loaded.");
            console.log(
                "It took",
                Date.now() - startLoadTime,
                "milliseconds to download OptiView Player",
                THEOplayer.version + "."
            );
            console.log(
                "The following OptiView Player features are enabled:",
                THEOplayer.features
            );
            console.log();
            callback();
        };
        script.src = url;
        startLoadTime = Date.now();
        document.head.appendChild(script); 
    }

    function initializeTHEOplayer() {
        const element = document.querySelector(".theoplayer-container");
        const player = new THEOplayer.Player(element, {
            libraryLocation: LIBRARY_LOCATION,
            ui: {
                width: "100%",
                height: "100%"
            }
        });
        player.abr.strategy = { type: "performance" }; // optimize for time-to-first-frame

        let requestPlayTime;
        function requestPlayTimeHandler() {
            player.removeEventListener("play", requestPlayTimeHandler);
            requestPlayTime = Date.now();
        }
        player.addEventListener("play", requestPlayTimeHandler);
        function playingHandler() {
            console.log(
                "The time-to-first-frame is",
                Date.now() - requestPlayTime,
                "milliseconds."
            );
            player.removeEventListener("playing", playingHandler);
        }
        player.addEventListener("playing", playingHandler);

        player.src = "https://cdn.theoplayer.com/video/elephants-dream/playlist.m3u8";
    }

    loadJsFile(LIBRARY_LOCATION + "THEOplayer.js", initializeTHEOplayer);

</script>
</main>
</body>
</html>
